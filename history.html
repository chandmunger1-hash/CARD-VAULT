<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order History - CARD VAULT</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; color: #fff; font-family: 'Share Tech Mono', monospace; padding: 20px; padding-bottom: 50px; background-image: radial-gradient(circle at 50% 0%, rgba(57,255,20,0.05) 0%, transparent 50%); min-height: 100vh;}
  
  .header { display: flex; align-items: center; margin-bottom: 25px; gap: 15px; }
  .back-btn { color: #39ff14; text-decoration: none; font-size: 1.5rem; background: #111; padding: 5px 15px; border-radius: 8px; border: 1px solid #333; }
  .title { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; }

  .history-container { display: flex; flex-direction: column; gap: 15px; }

  .history-card {
    background: #0a0f0a;
    border: 1px solid rgba(57,255,20,0.2);
    border-radius: 15px;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
  }

  .history-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0; width: 4px;
    background: #39ff14;
    border-top-left-radius: 15px;
    border-bottom-left-radius: 15px;
  }

  .card-info h4 { font-size: 1.1rem; color: #fff; margin-bottom: 5px; }
  .card-info p { font-size: 0.75rem; color: #888; }
  
  .card-price { text-align: right; }
  .card-price .amount { font-size: 1.2rem; color: #39ff14; font-weight: bold; }
  
  /* Naya Status Style (PENDING ke liye Orange) */
  .status-badge { 
    font-size: 0.7rem; 
    padding: 2px 8px; 
    border-radius: 10px; 
    margin-top: 5px; 
    display: inline-block; 
    border: 1px solid;
    font-weight: bold;
  }
  .status-pending {
    color: #ffa500; 
    background: rgba(255,165,0,0.1); 
    border-color: #ffa500;
  }

  .empty-history { text-align: center; color: #666; margin-top: 50px; }
  .empty-history span { font-size: 3rem; display: block; margin-bottom: 10px; }
</style>
</head>
<body>

  <div class="header">
    <a href="profile.html" class="back-btn">←</a>
    <div class="title">ORDER HISTORY</div>
  </div>

  <div class="history-container" id="historyList">
    <!-- History yahan aayegi JavaScript se -->
  </div>

  <script>
    window.onload = function() {
      // LocalStorage se history uthao
      let history = JSON.parse(localStorage.getItem('vault_history')) || [];
      let container = document.getElementById('historyList');

      if(history.length === 0) {
        container.innerHTML = `
          <div class="empty-history">
            <span>📭</span>
            <p>No orders found.</p>
            <!-- Link store.html par bhej raha hai -->
            <a href="store.html" style="color:#39ff14; text-decoration:none; margin-top:15px; display:inline-block; border:1px solid #39ff14; padding:10px 20px; border-radius:8px;">Go to Store →</a>
          </div>
        `;
        return;
      }

      // Agar history hai, toh dikhao (Latest first)
      history.reverse().forEach(item => {
        container.innerHTML += `
          <div class="history-card">
            <div class="card-info">
              <h4>${item.bank} ${item.network}</h4>
              <p>Card: **** ${item.last4} | ${item.date}</p>
              <p style="color: #aaa; margin-top: 5px; font-size: 0.7rem;">Order ID: ${item.orderId}</p>
            </div>
            <div class="card-price">
              <div class="amount">₹${item.price}</div>
              <!-- SUCCESS ki jagah PENDING dikhega -->
              <div class="status-badge status-pending">PENDING</div>
            </div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
