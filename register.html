<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - CARD VAULT</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; color: #fff; font-family: 'Share Tech Mono', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; background-image: radial-gradient(circle at 50% 0%, rgba(57,255,20,0.05) 0%, transparent 50%); }
  
  .login-container { width: 100%; max-width: 400px; background: #0a0f0a; border: 1px solid rgba(57,255,20,0.3); border-radius: 20px; padding: 40px 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); position: relative; overflow: hidden; }
  .login-container::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: #39ff14; box-shadow: 0 0 15px #39ff14; }
  
  .logo-container { text-align: center; margin-bottom: 30px; }
  .logo { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; letter-spacing: 2px; }
  .logo span { color: #39ff14; }
  .subtitle { font-size: 0.75rem; color: #888; letter-spacing: 2px; margin-top: 10px; }
  
  .input-group { margin-bottom: 20px; position: relative; }
  .input-label { display: block; font-size: 0.7rem; color: #39ff14; letter-spacing: 1px; margin-bottom: 8px; }
  .input-field { width: 100%; background: #000; border: 1px solid #333; padding: 15px 15px 15px 40px; color: #fff; font-family: 'Share Tech Mono', monospace; font-size: 1rem; border-radius: 10px; outline: none; }
  .input-field:focus { border-color: #39ff14; box-shadow: 0 0 15px rgba(57,255,20,0.2); }
  .input-icon { position: absolute; left: 12px; top: 33px; color: #555; font-size: 1.1rem; }
  
  .login-btn { width: 100%; background: #39ff14; color: #000; border: none; padding: 15px; border-radius: 10px; font-family: 'Share Tech Mono', monospace; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 20px rgba(57,255,20,0.3); transition: 0.3s; margin-top: 10px; }
  .login-btn:hover { background: #fff; }
  
  .login-footer { text-align: center; margin-top: 25px; font-size: 0.8rem; color: #666; }
  .login-footer a { color: #39ff14; text-decoration: none; }
  .login-footer a:hover { text-decoration: underline; }
  
  .error-msg { color: #ff3333; font-size: 0.8rem; text-align: center; margin-bottom: 15px; display: none; }
</style>
</head>
<body>

  <div class="login-container">
    <div class="logo-container">
      <div class="logo">CARD <span>VAULT</span></div>
      <div class="subtitle">CREATE SECURE ACCOUNT</div>
    </div>

    <div class="error-msg" id="errorMsg">Passwords do not match!</div>

    <form id="registerForm">
      <div class="input-group">
        <label class="input-label">CHOOSE USERNAME</label>
        <input type="text" id="regUser" class="input-field" placeholder="Create Username..." required>
        <span class="input-icon">👤</span>
      </div>
      
      <div class="input-group">
        <label class="input-label">PASSWORD</label>
        <input type="password" id="regPass" class="input-field" placeholder="Create Password..." required>
        <span class="input-icon">🔒</span>
      </div>

      <div class="input-group">
        <label class="input-label">CONFIRM PASSWORD</label>
        <input type="password" id="regConfirmPass" class="input-field" placeholder="Repeat Password..." required>
        <span class="input-icon">🔒</span>
      </div>

      <!-- YEH RAHA REFERRAL CODE KA OPTION -->
      <div class="input-group">
        <label class="input-label">REFERRAL CODE (Optional)</label>
        <input type="text" id="regRef" class="input-field" placeholder="Enter Friend's Code...">
        <span class="input-icon">🎁</span>
      </div>
      
      <button type="submit" class="login-btn">REGISTER NOW</button>
    </form>

    <div class="login-footer">
      Already have an account? <a href="login.html">Login Here</a>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault(); // Page refresh hone se rokna
      
      let user = document.getElementById('regUser').value.trim();
      let pass = document.getElementById('regPass').value;
      let confirmPass = document.getElementById('regConfirmPass').value;
      let refCodeEntered = document.getElementById('regRef').value.trim();
      let errorMsg = document.getElementById('errorMsg');

      // Password match check
      if(pass !== confirmPass) {
        errorMsg.style.display = 'block';
        return;
      }

      // User save karo
      localStorage.setItem('vault_user', user);
      localStorage.setItem('vault_pass', pass);

      // Referral Bonus logic
      if(refCodeEntered) {
        // Agar refer code daala hai toh ₹10 bonus
        localStorage.setItem('vault_balance', '10');
        
        // Purane user ka count badhao
        let currentRefCount = parseInt(localStorage.getItem('vault_ref_count') || '0');
        localStorage.setItem('vault_ref_count', currentRefCount + 1);
        
        alert("Referral Applied! You got ₹10 Bonus.");
      } else {
        // Agar nahi daala toh 0 balance
        localStorage.setItem('vault_balance', '0');
      }

      // Account ban gaya, ab login page par bhejo
      alert("Account Created Successfully! Please Login.");
      window.location.href = 'login.html'; 
    });
  </script>
</body>
</html>
